<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Mango Story Downloader</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Mango Story Downloader</h1>
    <button type="button" id="download-button">Tải video</button>
    <label class="option">
      <input type="checkbox" id="prefer-1080p" />
      <span>Tải bản 1080p khi có</span>
    </label>
    <p class="hint">Tắt nếu trình phát của máy không mở được file VP9, tiện ích sẽ lấy bản 720p.</p>
    <p id="status" class="status" role="status"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
